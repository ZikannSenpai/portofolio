<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ZikaNyawDev - Portfolio | Dashboard</title>
        <meta property="og:title" content="ZikaNyawDev Portfolio" />
        <meta
            property="og:description"
            content="Portfolio & Dashboard API ZikaNyawDev."
        />
        <meta
            property="og:image"
            content="https://zikaneko.vercel.app/src/zikk.png"
        />
        <meta property="og:url" content="https://zik-downloader.vercel.app" />
        <link rel="stylesheet" href="style.css" />
        <script src="https://cdn.tailwindcss.com"></script>
        <link
            href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Space+Grotesk:wght@500;700&display=swap"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        />

        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        fontFamily: {
                            mono: ['"JetBrains Mono"', "monospace"],
                            display: ['"Space Grotesk"', "sans-serif"]
                        },
                        boxShadow: {
                            hard: "5px 5px 0px 0px #1e293b",
                            "hard-hover": "2px 2px 0px 0px #1e293b",
                            "hard-sm": "3px 3px 0px 0px #1e293b"
                        },
                        colors: {
                            primary: "#6366f1",
                            secondary: "#a855f7",
                            dark: "#1e293b"
                        },
                        backgroundImage: {
                            "grid-pattern":
                                "linear-gradient(to right, #e2e8f0 1px, transparent 1px), linear-gradient(to bottom, #e2e8f0 1px, transparent 1px)"
                        },
                        animation: {
                            blob: "blob 7s infinite",
                            "fade-up": "fadeUp 0.5s ease-out forwards"
                        },
                        keyframes: {
                            blob: {
                                "0%": {
                                    transform: "translate(0px, 0px) scale(1)"
                                },
                                "33%": {
                                    transform:
                                        "translate(30px, -50px) scale(1.1)"
                                },
                                "66%": {
                                    transform:
                                        "translate(-20px, 20px) scale(0.9)"
                                },
                                "100%": {
                                    transform: "translate(0px, 0px) scale(1)"
                                }
                            },
                            fadeUp: {
                                "0%": {
                                    opacity: "0",
                                    transform: "translateY(10px)"
                                },
                                "100%": {
                                    opacity: "1",
                                    transform: "translateY(0)"
                                }
                            }
                        }
                    }
                }
            };
        </script>
        <style>
            body {
                opacity: 0;
                transition: opacity 0.6s ease;
            }

            body.loaded {
                opacity: 1;
            }
            .container {
                max-width: 800px;
                margin: 60px auto;
                padding: 20px;
            }
            .window {
                background: #f1f5f9;
                border: 3px solid #1e293b;
                box-shadow: 6px 6px 0 #1e293b;
            }

            .window-top {
                background: #e2e8f0;
                border-bottom: 3px solid #1e293b;
                padding: 10px;
                display: flex;
                align-items: center;
                gap: 8px;
            }

            .dot {
                width: 14px;
                height: 14px;
                border-radius: 50%;
                border: 2px solid #1e293b;
            }

            .red {
                background: #ef4444;
            }
            .yellow {
                background: #facc15;
            }
            .green {
                background: #22c55e;
            }
            .content {
                padding: 20px 20px;
                text-align: center;
            }
            .title-img {
                border-radius: 10%;
                width: 40%;
                border: 2px solid #1e293b;
                margin-bottom: 10px;
            }
            .title {
                font-size: 20px;
                font-weight: bold;

                color: #1e293b;

                letter-spacing: 1px;
            }
        </style>
    </head>
    <body class="landing-page font-display">
        <div class="container">
            <div class="window">
                <div class="window-top">
                    <div class="dot red"></div>
                    <div class="dot yellow"></div>
                    <div class="dot green"></div>
                </div>
                <div class="content">
                    <img class="title-img" src="assets/logo2.jpg" />
                    <div class="title font-display">About Me</div>
                    <div class="desc">Nyubi Developeler Full Ngestuck</div>
                </div>
            </div>
        </div>
        <script>
            window.addEventListener("load", () => {
                document.body.classList.add("loaded");
            });

            const observer = new IntersectionObserver(entries => {
                entries.forEach(e => {
                    if (e.isIntersecting) {
                        e.target.classList.add("show");
                    }
                });
            });

            document.querySelectorAll(".fade").forEach(el => {
                observer.observe(el);
            });
        </script>
        <script src="app.js"></script>
    </body>
</html>
