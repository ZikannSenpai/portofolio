<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ZikaNyawDev - Portfolio | Dashboard</title>
        <meta property="og:title" content="ZikaNyawDev Portfolio" />
        <meta
            property="og:description"
            content="Portfolio & Dashboard API ZikaNyawDev."
        />
        <meta
            property="og:image"
            content="https://zikaneko.vercel.app/src/zikk.png"
        />
        <meta property="og:url" content="https://zik-downloader.vercel.app" />
        <link rel="stylesheet" href="style.css" />
        <link rel="stylesheet" href="tech.css" />
        <script src="https://cdn.tailwindcss.com"></script>
        <link
            href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Space+Grotesk:wght@500;700&display=swap"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        />

        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        fontFamily: {
                            mono: ['"JetBrains Mono"', "monospace"],
                            display: ['"Space Grotesk"', "sans-serif"],
                            normal: ["ui-sans-serif", "system-ui", "sans-serif"]
                        },
                        boxShadow: {
                            hard: "5px 5px 0px 0px #1e293b",
                            "hard-hover": "2px 2px 0px 0px #1e293b",
                            "hard-sm": "3px 3px 0px 0px #1e293b"
                        },
                        colors: {
                            primary: "#6366f1",
                            secondary: "#a855f7",
                            dark: "#1e293b"
                        },
                        backgroundImage: {
                            "grid-pattern":
                                "linear-gradient(to right, #e2e8f0 1px, transparent 1px), linear-gradient(to bottom, #e2e8f0 1px, transparent 1px)"
                        },
                        animation: {
                            blob: "blob 7s infinite",
                            "fade-up": "fadeUp 0.5s ease-out forwards"
                        },
                        keyframes: {
                            blob: {
                                "0%": {
                                    transform: "translate(0px, 0px) scale(1)"
                                },
                                "33%": {
                                    transform:
                                        "translate(30px, -50px) scale(1.1)"
                                },
                                "66%": {
                                    transform:
                                        "translate(-20px, 20px) scale(0.9)"
                                },
                                "100%": {
                                    transform: "translate(0px, 0px) scale(1)"
                                }
                            },
                            fadeUp: {
                                "0%": {
                                    opacity: "0",
                                    transform: "translateY(10px)"
                                },
                                "100%": {
                                    opacity: "1",
                                    transform: "translateY(0)"
                                }
                            }
                        }
                    }
                }
            };
        </script>
    </head>

                    </div>

                        Full-Stuck Developer & Wibu Garis Keras
                    </div>

                    <div class="content">
                        <div class="grid fade">
                            <img class="title-img" src="assets/logo2.jpg" />

                            <div class="about font-display font-normal">
                                <strong>About Me</strong>
                            </div>

                            <div class="desc" id="type"></div>
                            <div class="cursor">|</div>
                            <div class="item">
                                <a
                                    href="https://github.com/zikannsenpai"
                                    target="_blank"
                                >
                                    <i class="fa-brands fa-github"></i>
                                </a>
                                <a
                                    href="https://tiktok.com/zikannsenpai"
                                    target="_blank"
                                >
                                    <i class="fa-brands fa-tiktok"></i>
                                </a>
                                <a
                                    href="https://wa.me/6285775359514"
                                    target="_blank"
                                >
                                    <i class="fa-brands fa-whatsapp"></i>
                                </a>
                            </div>
                        </div>
                    </div>
                    <div class="time font-normal font-bold">
                        <span id="time" class="font-bold"
                            ><strong> --:--:-- </strong>
                        </span>
                    </div>
                    <div class="content">
                        <div class="grid">
                            <div class="about font-normal font-bold">
                                <strong> Tech Stack </strong>
                                <i class="fa-solid fa-code"></i>
                            </div>
                            <div class="stack-icon">
                                <i class="fa-brands fa-html5"></i>
                                <i class="fa-brands fa-css3-alt"></i>
                                <i class="fa-brands fa-js"></i>
                                <i class="fa-brands fa-python"></i>
                                <i class="fa-brands fa-node-js"></i>
                                <i class="fa-solid fa-database"></i>
                                <i class="fa-brands fa-github"></i>
                            </div>
                            <div class="about font-normal font-bold">
                                <strong> Framework </strong>
                                <i class="fa-solid fa-terminal"></i>
                            </div>
                            <div class="stack-icon">
                                <i class="fa-brands fa-react"></i>
                                <i class="fa-brands fa-vuejs"></i>

                                <i class="fa-brands fa-bootstrap"></i>

            </div>
        </div>
        <div class="chibi">
            <img src="assets/chibi.png" />
            <div class="bubble" id="bubble">semangat harimu</div>
        </div>

        <div class="floating">
            <button class="kopi" onclick="kopi()">
                <i class="fa-solid fa-mug-hot"></i>
            </button>
            <button class="share" onclick="sharePage()">
                <i class="fa-solid fa-share-nodes"></i>
            </button>
            <button class="up" onclick="topPage()">
                <i class="fa-solid fa-arrow-up"></i>
            </button>
        </div>
        <script>
            window.addEventListener("load", () => {
                document.body.classList.add("loaded");
            });

            const observer = new IntersectionObserver(entries => {
                entries.forEach(e => {
                    if (e.isIntersecting) {
                        e.target.classList.add("show");
                    }
                });
            });
            document
                .querySelectorAll(".grid, .window, .project-btn .fade")
                .forEach(el => {
                    el.classList.add("fade");
                    observer.observe(el);
                });
        </script>
        <script src="app.js"></script>
    </body>
</html>
