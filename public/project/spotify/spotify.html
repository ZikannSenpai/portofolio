<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ZikaNyawDev - Donasi</title>
        <meta property="og:title" content="ZikaNyawDev - Donate" />
        <meta
            property="og:description"
            content="Dukung ZikaNyawDev Dengan Donasi."
        />
        <meta
            property="og:image"
            content="https://zikaneko.vercel.app/src/zikk.png"
        />
        <meta property="og:url" content="https://zikanyawdev.vercel.app" />
        <link rel="stylesheet" href="/project/spotify/style.css" />
        <script src="https://cdn.tailwindcss.com"></script>
        <link
            href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Space+Grotesk:wght@500;700&display=swap"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        />
    </head>
    <body>
        <div class="wrap">
            <section class="hero fade">
                <div class="title">Spotify Music Download</div>
                <div class="sub">
                    Unduh lagu dari spotify dengan cepat, mudah dan responsive.
                </div>

                <div class="search">
                    <input
                        id="query"
                        class="input"
                        type="text"
                        placeholder="Masukkan judul lagu atau artist..."
                    />
                    <button class="btn" id="searchBtn">Cari</button>
                </div>
            </section>

            <section class="grid">
                <div class="card fade" id="leftCard">
                    <img
                        id="thumb"
                        class="thumb"
                        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR5QOINeYUe_85OTkeIPMw-hG6Z0Kh4njryOmxYVoaqbw&s=10"
                        alt="Thumbnail"
                    />
                    <div class="info">
                        <div class="badge" id="badge">Track Info</div>
                        <div class="song" id="title">Belum ada data</div>

                        <div class="action">
                            <a class="ghost" id="download" href="#"
                                >Download Music</a
                            >
                        </div>
                    </div>
                </div>

                <div class="card fade" id="rightCard">
                    <div class="info">
                        <div class="meta">
                            <div class="row">
                                <span class="label">Type</span>
                                <span class="value" id="type">-</span>
                            </div>
                            <div class="row">
                                <span class="label">Artis</span>
                                <span class="value" id="artis">-</span>
                            </div>
                            <div class="row">
                                <span class="label">Durasi</span>
                                <span class="value" id="durasi">-</span>
                            </div>
                            <div class="row">
                                <span class="label">Album</span>
                                <span class="value" id="album">-</span>
                            </div>
                            <div class="row">
                                <span class="label">Tanggal Rilis</span>
                                <span class="value" id="releaseDate">-</span>
                            </div>
                            <div class="row">
                                <span class="label">Size</span>
                                <span class="value" id="size">-</span>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
        <script src="/project/spotify/app.js"></script>
    </body>
</html>
