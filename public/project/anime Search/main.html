<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ZikaNyawDev - Anime Search</title>
        <meta property="og:title" content="ZikaNyawDev - Anime Search" />
        <meta
            property="og:description"
            content="Search anime info from otakudesu"
        />
        <meta
            property="og:image"
            content="https://zikaneko.vercel.app/src/zikk.png"
        />
        <meta property="og:url" content="https://zikanyawdev.vercel.app" />
        <link rel="stylesheet" href="style.css" />
        <link rel="stylesheet" href="/project/anime Search/style.css" />
        <script src="https://cdn.tailwindcss.com"></script>
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <link
            href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Space+Grotesk:wght@500;700&display=swap"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        />

        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        fontFamily: {
                            mono: ['"JetBrains Mono"', "monospace"],
                            display: ['"Space Grotesk"', "sans-serif"],
                            normal: ["ui-sans-serif", "system-ui", "sans-serif"]
                        },
                        boxShadow: {
                            hard: "5px 5px 0px 0px #1e293b",
                            "hard-hover": "2px 2px 0px 0px #1e293b",
                            "hard-sm": "3px 3px 0px 0px #1e293b"
                        },
                        colors: {
                            primary: "#6366f1",
                            secondary: "#a855f7",
                            dark: "#1e293b"
                        },
                        backgroundImage: {
                            "grid-pattern":
                                "linear-gradient(to right, #e2e8f0 1px, transparent 1px), linear-gradient(to bottom, #e2e8f0 1px, transparent 1px)"
                        },
                        animation: {
                            blob: "blob 7s infinite",
                            "fade-up": "fadeUp 0.5s ease-out forwards"
                        },
                        keyframes: {
                            blob: {
                                "0%": {
                                    transform: "translate(0px, 0px) scale(1)"
                                },
                                "33%": {
                                    transform:
                                        "translate(30px, -50px) scale(1.1)"
                                },
                                "66%": {
                                    transform:
                                        "translate(-20px, 20px) scale(0.9)"
                                },
                                "100%": {
                                    transform: "translate(0px, 0px) scale(1)"
                                }
                            },
                            fadeUp: {
                                "0%": {
                                    opacity: "0",
                                    transform: "translateY(10px)"
                                },
                                "100%": {
                                    opacity: "1",
                                    transform: "translateY(0)"
                                }
                            }
                        }
                    }
                }
            };
        </script>
    </head>
    <body>
        <div class="header font-normal">
            <div class="header-title">
                <i class="fa-solid fa-bars" id="navBtn"></i>Anime Info Search
            </div>
        </div>
        <div id="overlay"></div>
        <div id="sidebar">
            <div class="nav-profile">
                <img
                    class="nav-img"
                    src="https://zikaneko.vercel.app/src/zikk.png"
                    alt="logo"
                />
                <span class="nav-img-title">ZikaNyawDev</span>
            </div>
            <div class="nav-line"></div>
            <span class="nav-txt">MENU UTAMA</span>
            <div class="nav-item">
                <div class="nav-grid">
                    <i class="fa-solid fa-arrow-left"></i>
                    <a href="/" class="nav-btn">Back to Home</a>
                </div>
            </div>
        </div>

        <div class="container">
            <div class="typing">
                <span id="type">-</span>
                <span class="cursor">|</span>
            </div>
            <div class="desc">
                Pusat Layanan <strong>API Gratis</strong> Terbaik. Dapatkan
                akses ke <strong>API Anime, API Comic,</strong> dan Api Lainnya
                tanpa batas.
            </div>
            <div class="desc-footer">
                ZikaNyawDev - Powering Your Projects since 21 Jun 2024
            </div>
            <div class="search-page">
                <div class="search-title">Masukan Nama Anime</div>
                <div class="search-input">
                    <input
                        id="search"
                        type="text"
                        placeholder="Contoh: Tonikaku"
                    />
                </div>
                <div class="search-box">
                    <button id="search-btn" class="search-btn">
                        Cari Anime
                    </button>
                </div>
            </div>
            <div class="result" id="results"></div>
        </div>
        <script src="app.js"></script>
        <script src="/project/anime Search/app.js"></script>
    </body>
</html>
